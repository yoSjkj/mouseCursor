plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.hereng.mousecursor'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hereng.mousecursor'
        minSdk 35
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android Code Studio가 빌드에 끼워 넣는 로그 수집기(LogWire)가 Kotlin으로 되어 있어서,
    // 이게 없으면 앱이 시작하자마자 죽는다. 앱 코드 자체는 쓰지 않는다.
    implementation libs.kotlin.stdlib
}
